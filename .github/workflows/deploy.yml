
name: Frontend CI/CD

on:
  push:
    branches:
      - main
      - 'feature/**'

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: '22'
  AWS_REGION: us-east-2
  AWS_ROLE_ARN: arn:aws:iam::525388658102:role/github-actions-thaki-frontend-role
  S3_BUCKET: thaki-site-frontend
  CLOUDFRONT_DISTRIBUTION_ID: EVLO45IHXVWUB
  API_URL: https://api.thaki.site

jobs:

  # 1. Validar y construir frontend.
  build:
    name: Validate and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify dist
        run: |
          test -d dist || { echo "::error::No se generó dist/"; exit 1; }
          test -f dist/index.html || { echo "::error::Falta dist/index.html"; exit 1; }
          ls dist/assets/*.js >/dev/null 2>&1 || {
            echo "::error::No se encontraron bundles JavaScript"
            exit 1
          }

          grep -rqF "$API_URL" dist/assets || {
            echo "::error::El bundle no apunta a $API_URL"
            exit 1
          }

          echo "Build validado correctamente."
          find dist -type f | sort

      # Solo se almacena el artefacto en ejecuciones de producción.
      - name: Upload dist artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # 2. Publicar frontend en S3.
  deploy:
    name: Deploy to S3
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: gha-thaki-frontend-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      # Primero se publican los assets nuevos.
      # No eliminamos los antiguos para evitar romper sesiones abiertas.
      - name: Sync hashed assets
        run: |
          aws s3 sync dist/assets "s3://$S3_BUCKET/assets" \
            --cache-control "public, max-age=31536000, immutable" \
            --no-progress

      # Después se publica index.html y los archivos restantes.
      # ⚠️ --delete: borra de la raíz del bucket todo objeto que no esté en dist/
      #    (excepto assets/, excluido aquí).
      - name: Sync root files
        run: |
          aws s3 sync dist "s3://$S3_BUCKET" \
            --exclude "assets/*" \
            --delete \
            --cache-control "no-cache, max-age=0, must-revalidate" \
            --no-progress

      - name: Deployment summary
        run: |
          {
            echo "## Despliegue del frontend Thaki"
            echo ""
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Bucket | s3://$S3_BUCKET |"
            echo "| Commit | ${GITHUB_SHA::7} |"
            echo "| Autor | $GITHUB_ACTOR |"
            echo "| Archivos | $(find dist -type f | wc -l) |"
            echo "| Tamaño | $(du -sh dist | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"

  # 3. Invalidar caché de CloudFront.
  invalidate:
    name: Invalidate CloudFront
    needs: deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: gha-thaki-frontend-invalidate-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create invalidation
        id: invalidation
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)

          echo "id=$INVALIDATION_ID" >> "$GITHUB_OUTPUT"
          echo "Invalidation ID: $INVALIDATION_ID"

      - name: Invalidation summary
        run: |
          {
            echo "## Invalidación de CloudFront"
            echo ""
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Distribución | $CLOUDFRONT_DISTRIBUTION_ID |"
            echo "| Invalidation ID | ${{ steps.invalidation.outputs.id }} |"
            echo "| Rutas | /* |"
            echo "| Sitio | https://thaki.site |"
          } >> "$GITHUB_STEP_SUMMARY"
